        "imports": {

          "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm",
          "d3-sankey": "https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/+esm",

        }

    <style>
      body {
        background: #0f172a;
        font-family: system-ui, sans-serif;
      }

      .drop-zone {
        transition:
          border-color 0.2s,

      #sankey-tooltip {

  <body class="text-slate-100">
    <pkg-lock-visualizer></pkg-lock-visualizer>
    <div id="sankey-tooltip"></div>

    <script type="module">
      import { LitElement, html } from 'lit';
      import * as d3 from 'd3';
      import { sankey as createSankey, sankeyLinkHorizontal, sankeyLeft } from 'd3-sankey';
      import { maxSatisfying } from 'semver';

      /* ── Data layer (from data.js) ──────────────────────────────────── */

      function buildSankeyData(lock, { includeDev = true } = {}) {
        const packages = lock.packages ?? {};
        const rootName = lock.name || 'root';

        const nodeMap = new Map();
        const pkgMap = new Map();
        const pathToId = new Map();
        const linkMap = new Map();

        for (const [path, info] of Object.entries(packages)) {
          const isRoot = path === '';
          if (!isRoot && !includeDev && info.dev) continue;

          const name = isRoot ? rootName : path.split('node_modules/').at(-1);
          const version = info.version ?? '0.0.0';
          const id = `${name}@${version}`;

          pathToId.set(path, id);
          if (!pkgMap.has(name)) pkgMap.set(name, new Map());
          pkgMap.get(name).set(version, id);

          if (!nodeMap.has(id)) {
            nodeMap.set(id, {
              id,
              name,
              nameLower: name.toLowerCase(),
              version,
              dev: info.dev ?? false,
              isPeer: info.peer ?? false,
              isRoot,
              isConflict: false,
            });
          } else {
            const node = nodeMap.get(id);
            if (!info.dev) node.dev = false;
            if (!info.peer) node.isPeer = false;
          }
        }

        for (const [, versions] of pkgMap) {
          if (versions.size > 1) {
            const versionList = [...versions.keys()].sort((a, b) =>
              a.localeCompare(b, undefined, { numeric: true })
            );
            for (const id of versions.values()) {
              const node = nodeMap.get(id);
              node.isConflict = true;
              node.conflictVersions = versionList;
            }
          }
        }

        for (const [path, info] of Object.entries(packages)) {
          const id = pathToId.get(path);
          if (!id) continue;
          if (
            !info.dependencies &&
            !info.devDependencies &&
            !info.optionalDependencies &&
            !info.peerDependencies
          )
            continue;
          const allDeps = {
            ...info.dependencies,
            ...(includeDev ? info.devDependencies : undefined),
            ...info.optionalDependencies,
          };

          for (const [dep, range] of Object.entries(allDeps)) {
            if (!pkgMap.has(dep)) continue;
            const versions = [...pkgMap.get(dep).keys()];
            const resolved = maxSatisfying(versions, range);
            if (!resolved) continue;
            const target = `${dep}@${resolved}`;
            const key = `${id}→${target}`;
            if (!linkMap.has(key)) linkMap.set(key, { source: id, target, value: 1 });
          }

          for (const [dep, range] of Object.entries(info.peerDependencies ?? {})) {
            if (!pkgMap.has(dep)) continue;
            const versions = [...pkgMap.get(dep).keys()];
            const resolved = maxSatisfying(versions, range);
            if (!resolved) continue;
            const target = `${dep}@${resolved}`;
            const key = `${id}→${target}`;
            if (!nodeMap.get(target).isPeer) continue;
            if (!linkMap.has(key)) linkMap.set(key, { source: id, target, value: 1, isPeer: true });
          }
        }

        // Build adjacency list then run iterative DFS to drop back edges (cycle-breaking).
        const adjacency = new Map();
        for (const id of nodeMap.keys()) adjacency.set(id, new Set());
        for (const { source, target } of linkMap.values()) adjacency.get(source)?.add(target);

        const visited = new Set();
        const inPath = new Set();
        for (const startId of nodeMap.keys()) {
          if (visited.has(startId)) continue;
          const stack = [{ nodeId: startId, neighbors: adjacency.get(startId).values() }];
          inPath.add(startId);
          visited.add(startId);
          while (stack.length > 0) {
            const frame = stack[stack.length - 1];
            const { value: neighbor, done } = frame.neighbors.next();
            if (done) {
              inPath.delete(frame.nodeId);
              stack.pop();
            } else if (inPath.has(neighbor)) {
              linkMap.delete(`${frame.nodeId}→${neighbor}`);
            } else if (!visited.has(neighbor)) {
              visited.add(neighbor);
              inPath.add(neighbor);
              stack.push({ nodeId: neighbor, neighbors: adjacency.get(neighbor).values() });
            }
          }
        }

        const rootEntry = packages[''] ?? {};
        const rootDeps = new Map();
        for (const name of Object.keys(rootEntry.dependencies ?? {})) rootDeps.set(name, 'prod');
        for (const name of Object.keys(rootEntry.devDependencies ?? {})) rootDeps.set(name, 'dev');
        for (const name of Object.keys(rootEntry.optionalDependencies ?? {})) rootDeps.set(name, 'optional');
        for (const name of Object.keys(rootEntry.peerDependencies ?? {})) rootDeps.set(name, 'peer');

        const nodeList = Array.from(nodeMap.values());
        return {
          name: rootName,
          lockfileVersion: lock.lockfileVersion ?? 1,
          installPaths: Object.keys(packages).filter((k) => k !== '').length,
          uniqueCount: pkgMap.size - 1,
          packages: pkgMap,
          rootDeps,
          nodes: nodeList,
          links: Array.from(linkMap.values()),
        };
      }

      const NO_PACKAGES_MSG = '<p style="color:#475569;padding:3rem;text-align:center">No packages match this filter.</p>';
      const STORAGE_KEY = 'pkg-lock-saves';

      /* ── Color scale (indexed by d3-sankey's assigned depth) ───────── */
      const DEPTH_COLORS = [
        '#6366f1',
        '#3b82f6',
        '#06b6d4',
        '#10b981',
        '#f59e0b',
        '#f97316',
        '#ef4444',
      ];
      const SEVERITY_RANK = { CRITICAL: 4, HIGH: 3, MODERATE: 2, LOW: 1 };
      const SEVERITY_COLOR = { CRITICAL: '#ef4444', HIGH: '#f97316', MODERATE: '#f59e0b', LOW: '#fbbf24' };

      function parseCvssV3Score(vector) {
        const m = {};
        for (const part of vector.split('/').slice(1)) {
          const [k, v] = part.split(':');
          m[k] = v;
        }
        const AV = { N: 0.85, A: 0.62, L: 0.55, P: 0.2 }[m.AV] ?? 0.85;
        const AC = { L: 0.77, H: 0.44 }[m.AC] ?? 0.77;
        const sc = m.S === 'C';
        const PR = sc ? { N: 0.85, L: 0.68, H: 0.50 }[m.PR] ?? 0.85 : { N: 0.85, L: 0.62, H: 0.27 }[m.PR] ?? 0.85;
        const UI = { N: 0.85, R: 0.62 }[m.UI] ?? 0.85;
        const CIA = { N: 0, L: 0.22, H: 0.56 };
        const iscBase = 1 - (1 - (CIA[m.C] ?? 0)) * (1 - (CIA[m.I] ?? 0)) * (1 - (CIA[m.A] ?? 0));
        const isc = sc
          ? 7.52 * (iscBase - 0.029) - 3.25 * Math.pow(iscBase - 0.02, 15)
          : 6.42 * iscBase;
        if (isc <= 0) return 0;
        const base = sc
          ? Math.min(1.08 * (isc + 8.22 * AV * AC * PR * UI), 10)
          : Math.min(isc + 8.22 * AV * AC * PR * UI, 10);
        return Math.ceil(base * 10) / 10;
      }

      function getSeverity(v) {
        const db = v.database_specific?.severity?.toUpperCase();
        if (db && SEVERITY_RANK[db]) return db;
        for (const s of v.severity ?? []) {
          if (s.type === 'CVSS_V3') {
            try {
              const score = parseCvssV3Score(s.score);
              if (score >= 9.0) return 'CRITICAL';
              if (score >= 7.0) return 'HIGH';
              if (score >= 4.0) return 'MODERATE';
              if (score > 0)   return 'LOW';
            } catch {}
          }
        }
        return null;
      }

      function worstSeverity(vulns) {
        let worst = null, rank = 0;
        for (const v of vulns) {
          const s = getSeverity(v);
          if (s && (SEVERITY_RANK[s] ?? 0) > rank) { worst = s; rank = SEVERITY_RANK[s]; }
        }
        return worst;
      }
      function vulnColor(vulns) {
        const s = worstSeverity(vulns);
        return SEVERITY_COLOR[s] ?? '#ef4444';
      }
      const depthColor = (d) =>
        d.isConflict ? '#c026d3' : DEPTH_COLORS[Math.min(d.depth ?? 0, DEPTH_COLORS.length - 1)];

      /* ── Tooltip ────────────────────────────────────────────────────── */
      const $tip = () => document.getElementById('sankey-tooltip');
      let _tipTimer = null;
      function showTip(ev, markup) {
        clearTimeout(_tipTimer);
        const t = $tip();
        t.innerHTML = markup;
        t.style.display = 'block';
        t.style.left = ev.clientX + 14 + 'px';
        t.style.top = ev.clientY - 8 + 'px';
      }
      function hideTip() {
        _tipTimer = setTimeout(() => { $tip().style.display = 'none'; }, 200);
      }
      document.getElementById('sankey-tooltip').addEventListener('mouseenter', () => clearTimeout(_tipTimer));
      document.getElementById('sankey-tooltip').addEventListener('mouseleave', hideTip);

      /* ── Depth helpers ──────────────────────────────────────────────── */
      function computeMaxDepth(nodes, links) {
        if (!nodes.length || !links.length) return 1;
        const layout = createSankey()
          .nodeId((d) => d.id)
          .nodeAlign(sankeyLeft);
        const graph = layout({
          nodes: nodes.map((d) => ({ ...d })),
          links: links.map((d) => ({ ...d })),
        });
        return Math.max(0, ...graph.nodes.map((n) => n.depth ?? 0)) + 1;
      }

      function filterByDepth(nodes, links, depthLimit) {
        const layout = createSankey()
          .nodeId((d) => d.id)
          .nodeAlign(sankeyLeft);
        const graph = layout({
          nodes: nodes.map((d) => ({ ...d })),
          links: links.map((d) => ({ ...d })),
        });
        const allowed = new Set(
          graph.nodes.filter((n) => (n.depth ?? 0) <= depthLimit - 1).map((n) => n.id)
        );
        return {
          nodes: nodes.filter((n) => allowed.has(n.id)),
          links: links.filter((l) => allowed.has(l.source) && allowed.has(l.target)),
        };
      }

      function buildAncestorAllowed(nodes, links, predicate) {
        const seeds = new Set(nodes.filter(predicate).map((n) => n.id));
        const incoming = new Map();
        for (const n of nodes) incoming.set(n.id, []);
        for (const l of links) incoming.get(l.target)?.push(l.source);
        return bfsReach(seeds, incoming);
      }

      function bfsReach(seeds, adj) {
        const visited = new Set(seeds);
        const queue = [...seeds];
        let i = 0;
        while (i < queue.length) {
          for (const nb of (adj.get(queue[i++]) ?? [])) {
            if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
          }
        }
        return visited;
      }

      function computeTreeSizesFromLinks(nodes, links) {
        const outgoing = new Map();
        for (const n of nodes) outgoing.set(n.id, []);
        for (const l of links) outgoing.get(l.source)?.push(l.target);
        const sizes = new Map();
        for (const node of nodes)
          sizes.set(node.id, bfsReach(new Set([node.id]), outgoing).size - 1);
        return sizes;
      }

      function computeTopPackages(nodes, treeSizeMap, topN = 5) {
        const byName = new Map();
        for (const n of nodes) {
          const size = treeSizeMap.get(n.id) ?? 0;
          if (!byName.has(n.name) || size > byName.get(n.name).treeSize)
            byName.set(n.name, { name: n.name, treeSize: size });
        }
        return [...byName.values()]
          .filter((p) => p.treeSize > 0)
          .sort((a, b) => b.treeSize - a.treeSize)
          .slice(0, topN);
      }

      /* ── Render ─────────────────────────────────────────────────────── */
      function renderSankey(container, nodes, links, depthLimit, treeSizeMap, onNodeClick, vulnMap) {
        container.innerHTML = '';

        const visible =
          depthLimit != null ? filterByDepth(nodes, links, depthLimit) : { nodes, links };
        nodes = visible.nodes;
        links = visible.links;

        if (!nodes.length) {
          container.innerHTML = NO_PACKAGES_MSG;
          return;
        }

        if (!links.length) {
          const wrap = document.createElement('div');
          wrap.style.cssText =
            'display:flex;flex-wrap:wrap;gap:8px;padding:24px;align-content:flex-start;';
          for (const n of nodes) {
            const tag = document.createElement('span');
            const color = vulnMap?.has(n.id) ? vulnColor(vulnMap.get(n.id)) : n.isConflict ? '#c026d3' : '#6366f1';
            tag.style.cssText = `display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-family:system-ui,sans-serif;border:1px solid ${color}44;color:#cbd5e1;background:${color}18;`;
            tag.textContent = `${n.name}@${n.version}`;
            wrap.appendChild(tag);
          }
          container.appendChild(wrap);
          return;
        }

        const W = Math.max(container.clientWidth || 900, 600);
        const H = Math.max(640, nodes.length * 22 + 60);

        const svg = d3
          .select(container)
          .append('svg')
          .attr('width', W)
          .attr('height', H)
          .style('font-family', 'system-ui, sans-serif');

        const layout = createSankey()
          .nodeId((d) => d.id)
          .nodeWidth(14)
          .nodePadding(6)
          .nodeAlign(sankeyLeft)
          .extent([
            [12, 12],
            [W - 12, H - 12],
          ]);

        const graph = layout({
          nodes: nodes.map((d) => ({ ...d })),
          links: links.map((d) => ({ ...d })),
        });

        const defs = svg.append('defs');
        ['LOW','MODERATE','HIGH','CRITICAL'].forEach((sev) => {
          const color = SEVERITY_COLOR[sev];
          const pat = defs.append('pattern')
            .attr('id', `vp-${sev}`)
            .attr('patternUnits', 'userSpaceOnUse')
            .attr('width', 8).attr('height', 8)
            .attr('patternTransform', 'rotate(45 0 0)');
          pat.append('rect').attr('width', 8).attr('height', 8).attr('fill', color);
          pat.append('rect').attr('width', 2).attr('height', 8).attr('fill', '#000').attr('opacity', 0.5);
        });

        svg
          .append('g')
          .selectAll('path')
          .data(graph.links)
          .join('path')
          .attr('class', (d) => `sankey-link${d.isPeer ? ' peer' : ''}`)
          .attr('d', sankeyLinkHorizontal())
          .attr('stroke', (d) => (d.target.isConflict ? '#c026d3' : depthColor(d.source)))
          .attr('stroke-width', (d) => Math.max(1, d.width))
          .on('mousemove', (ev, d) =>
            showTip(
              ev,
              `<span style="color:#94a3b8">${d.source.name}</span> <span style="color:#475569">→</span> <span style="color:#94a3b8">${d.target.name}</span>${d.isPeer ? ' <span style="color:#7c3aed;font-size:10px">(peer)</span>' : ''}`
            )
          )
          .on('mouseleave', hideTip);

        const nodeG = svg
          .append('g')
          .selectAll('g')
          .data(graph.nodes)
          .join('g')
          .attr('transform', (d) => `translate(${d.x0},${d.y0})`);

        nodeG
          .append('rect')
          .attr('height', (d) => Math.max(3, d.y1 - d.y0))
          .attr('width', (d) => d.x1 - d.x0)
          .attr('rx', 2)
          .attr('fill', (d) => {
            const vulns = vulnMap?.get(d.id);
            if (!vulns) return depthColor(d);
            const sev = worstSeverity(vulns) ?? 'CRITICAL';
            return `url(#vp-${sev})`;
          });

        nodeG
          .append('text')
          .attr('x', (d) => (d.x0 < W / 2 ? d.x1 - d.x0 + 6 : -6))
          .attr('y', (d) => (d.y1 - d.y0) / 2)
          .attr('dy', '0.35em')
          .attr('text-anchor', (d) => (d.x0 < W / 2 ? 'start' : 'end'))
          .attr('fill', '#cbd5e1')
          .attr('font-size', 11)
          .text((d) => {
            const l = d.isRoot ? `${d.name} (root)` : d.name;
            return l.length > 32 ? l.slice(0, 30) + '…' : l;
          });

        nodeG
          .style('cursor', (d) => (d.isRoot || !onNodeClick ? 'default' : 'pointer'))
          .on('mousemove', (ev, d) => {
            const into = d.targetLinks?.length ?? 0;
            const treeSize = treeSizeMap.get(d.id) ?? 0;
            const typeLabel = d.isPeer
              ? '<span style="color:#7c3aed">peer</span>'
              : d.dev
                ? '<span style="color:#64748b">dev</span>'
                : '<span style="color:#10b981">prod</span>';
            const versionLine = d.isConflict && d.conflictVersions?.length
              ? `<div style="color:#c026d3;font-size:11px">${d.conflictVersions.length} versions: ${d.conflictVersions.join(', ')}</div>`
              : `<div style="color:#64748b;font-size:11px">v${d.version}</div>`;
            const nodeVulns = vulnMap?.get(d.id) ?? [];
            const vulnHtml = nodeVulns.length
              ? (() => {
                  const color = vulnColor(nodeVulns);
                  return `<div style="color:${color};margin-top:6px;padding-top:6px;border-top:1px solid #334155;font-weight:600">⚠ ${nodeVulns.length} vulnerability${nodeVulns.length !== 1 ? 'ies' : ''}</div>
              ${nodeVulns.slice(0, 3).map((v) => {
                const sev = getSeverity(v);
                const sevColor = sev ? (SEVERITY_COLOR[sev] ?? '#fca5a5') : '#fca5a5';
                return `<div style="font-size:10px;margin-top:2px"><a href="https://osv.dev/vulnerability/${v.id}" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:underline;text-decoration-color:#475569;text-underline-offset:2px">${v.id}</a>${sev ? ` · <span style="color:${sevColor};font-weight:600">${sev}</span>` : ''}</div>`;
              }).join('')}
              ${nodeVulns.length > 3 ? `<div style="font-size:10px;color:#64748b">+${nodeVulns.length - 3} more</div>` : ''}`;
                })()
              : '';
            showTip(
              ev,
              `<div style="font-weight:600;color:#f1f5f9">${d.name}${d.isRoot ? ' <span style="color:#818cf8">(root)</span>' : ''}</div>
              ${versionLine}
              <div style="color:#64748b;margin-top:4px">Depth <span style="color:#94a3b8">${d.depth ?? 0}</span></div>
              <div style="color:#64748b">Used by <span style="color:#94a3b8">${into}</span> pkg${into !== 1 ? 's' : ''}</div>
              <div style="color:#64748b">Tree size <span style="color:#94a3b8">${treeSize}</span> pkg${treeSize !== 1 ? 's' : ''}</div>
              ${!d.isRoot ? `<div style="color:#64748b">${typeLabel}</div>` : ''}
              ${vulnHtml}
              ${!d.isRoot ? '<div style="color:#475569;font-size:11px;margin-top:4px">Click to isolate</div>' : ''}`
            );
          })
          .on('mouseleave', hideTip)
          .on('click', (ev, d) => {
            if (d.isRoot || !onNodeClick) return;
            hideTip();
            onNodeClick(d.name);
          });
      }

      /* ── Lit component ──────────────────────────────────────────────── */
      class PkgLockVisualizer extends LitElement {
        static properties = {
          _phase: { state: true },
          _data: { state: true },
          _error: { state: true },
          _maxDepth: { state: true },
          _selectedDepth: { state: true },
          _filter: { state: true },
          _conflictCount: { state: true },
          _searchQuery: { state: true },
          _visibleCount: { state: true },
          _suggestions: { state: true },
          _inputFocused: { state: true },
          _focusedPackage: { state: true },
          _topPackages: { state: true },
          _showInfo: { state: true },
          _savedFiles: { state: true },
          _vulnMap: { state: true },
          _vulnStatus: { state: true },
        };

        createRenderRoot() {
          return this;
        }

        constructor() {
          super();
          this._phase = 'idle';
          this._data = null;
          this._error = '';
          this._maxDepth = null;
          this._selectedDepth = null;
          this._filter = 'all';
          this._conflictCount = 0;
          this._searchQuery = '';
          this._visibleCount = 0;
          this._suggestions = [];
          this._inputFocused = false;
          this._focusedPackage = null;
          this._topPackages = null;
          this._showInfo = false;
          this._savedFiles = [];
          this._vulnMap = null;
          this._vulnStatus = 'idle';
          this._osvRequestId = 0;
        }

        connectedCallback() {
          super.connectedCallback();
          this._loadSavedFiles();
        }

        _onDragOver(e) {
          e.preventDefault();
          this.querySelector('.drop-zone')?.classList.add('drag-over');
        }
        _onDragLeave() {
          this.querySelector('.drop-zone')?.classList.remove('drag-over');
        }
        _onDrop(e) {
          e.preventDefault();
          this.querySelector('.drop-zone')?.classList.remove('drag-over');
          this._loadFile(e.dataTransfer?.files?.[0]);
        }
        _onFileInput(e) {
          this._loadFile(e.target.files?.[0]);
        }

        _loadJson(json) {
          try {
            if (!json.dependencies && !json.packages) {
              throw new Error(
                'Missing dependencies/packages field — is this a package-lock.json?'
              );
            }
            const data = buildSankeyData(json);
            const rootId = data.nodes.find((n) => n.isRoot)?.id;
            const depthNodes = data.nodes.filter((n) => !n.isRoot);
            const depthLinks = data.links.filter((l) => l.source !== rootId);
            const maxDepth = computeMaxDepth(depthNodes, depthLinks);
            this._data = data;
            this._maxDepth = maxDepth;
            this._selectedDepth = maxDepth;
            this._conflictCount = data.nodes.filter((n) => n.isConflict).length;
            this._filter = 'all';
            this._searchQuery = '';
            this._visibleCount = 0;
            this._focusedPackage = null;
            this._vulnMap = null;
            this._vulnStatus = 'loading';
            this._phase = 'loaded';
            this._error = '';
            document.title = `Package Lock Visualizer — ${data.name}`;
            this.requestUpdate();
            this._redraw();
            const reqId = ++this._osvRequestId;
            this._queryOSV(data.nodes, reqId);
          } catch (err) {
            console.error(err);
            this._error = err.message;
            this._phase = 'error';
          }
        }

        _loadFile(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const raw = e.target.result;
              this._loadJson(JSON.parse(raw));
              this._saveFile(file.name, raw);
            } catch (err) {
              console.error(err);
              this._error = err.message;
              this._phase = 'error';
            }
          };
          reader.readAsText(file);
        }

        async _queryOSV(nodes, requestId) {
          const isSemverLike = (v) => /^v?\d+\.\d/.test(v);
          const byId = new Map(
            nodes.filter((n) => !n.isRoot && isSemverLike(n.version)).map((n) => [n.id, n])
          );
          const nodeList = [...byId.values()];
          const CHUNK = 1000;
          const vulnMap = new Map();
          try {
            // Phase 1: batch query → get compact stub objects (id + modified only)
            for (let i = 0; i < nodeList.length; i += CHUNK) {
              const chunk = nodeList.slice(i, i + CHUNK);
              const res = await fetch('https://api.osv.dev/v1/querybatch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  queries: chunk.map((n) => ({
                    version: n.version,
                    package: { name: n.name, ecosystem: 'npm' },
                  })),
                }),
              });
              if (!res.ok) throw new Error(`OSV ${res.status}`);
              const { results } = await res.json();
              if (this._osvRequestId !== requestId) return;
              for (let j = 0; j < chunk.length; j++) {
                const vulns = results[j]?.vulns ?? [];
                if (vulns.length) vulnMap.set(chunk[j].id, vulns);
              }
            }

            // Phase 2: fetch full vuln details (severity, CVSS, etc.) for each unique ID
            const uniqueIds = [...new Set([...vulnMap.values()].flat().map((v) => v.id))];
            const CONCURRENCY = 10;
            const fullById = new Map();
            for (let i = 0; i < uniqueIds.length; i += CONCURRENCY) {
              const batch = uniqueIds.slice(i, i + CONCURRENCY);
              const fetched = await Promise.all(
                batch.map((id) =>
                  fetch(`https://api.osv.dev/v1/vulns/${id}`)
                    .then((r) => (r.ok ? r.json() : null))
                    .catch(() => null)
                )
              );
              if (this._osvRequestId !== requestId) return;
              for (const v of fetched) if (v) fullById.set(v.id, v);
            }

            // Replace stubs with full objects
            for (const [nodeId, vulns] of vulnMap) {
              vulnMap.set(nodeId, vulns.map((v) => fullById.get(v.id) ?? v));
            }

            if (this._osvRequestId !== requestId) return;
            this._vulnMap = vulnMap;
            this._vulnStatus = 'done';
            this.requestUpdate();
            this._redraw();
          } catch (err) {
            if (this._osvRequestId !== requestId) return;
            console.error('OSV query failed:', err);
            this._vulnStatus = 'error';
            this.requestUpdate();
          }
        }

        _loadSavedFiles() {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            this._savedFiles = stored ? JSON.parse(stored) : [];
          } catch {
            this._savedFiles = [];
          }
        }

        _saveFile(filename, raw) {
          try {
            const { name, installPaths } = this._data;
            const entry = {
              id: crypto.randomUUID(),
              name,
              filename,
              pkgCount: installPaths,
              savedAt: new Date().toISOString(),
              raw,
            };
            const updated = [entry, ...this._savedFiles.filter((f) => f.name !== name)].slice(0, 10);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
            this._savedFiles = updated;
          } catch {
            // storage quota exceeded or unavailable
          }
        }

        _deleteFile(id, e) {
          e.stopPropagation();
          const updated = this._savedFiles.filter((f) => f.id !== id);
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
          } catch {
            // storage quota exceeded or unavailable
          }
          this._savedFiles = updated;
        }

        _getFilteredData() {
          const rootId = this._data.nodes.find((n) => n.isRoot)?.id;
          let nodes = this._data.nodes.filter((n) => !n.isRoot);
          let links = this._data.links.filter((l) => l.source !== rootId);

          if (this._filter !== 'all') {
            let allowed;
            if (this._filter === 'prod')
              allowed = new Set(nodes.filter((n) => !n.dev).map((n) => n.id));
            else if (this._filter === 'dev')
              allowed = new Set(nodes.filter((n) => n.dev).map((n) => n.id));
            else if (this._filter === 'conflict')
              allowed = buildAncestorAllowed(nodes, links, (n) => n.isConflict);
            else if (this._filter === 'vuln')
              allowed = buildAncestorAllowed(nodes, links, (n) => this._vulnMap?.has(n.id));
            nodes = nodes.filter((n) => allowed.has(n.id));
            links = links.filter((l) => allowed.has(l.source) && allowed.has(l.target));
          }

          if (this._focusedPackage) {
            return this._getFocusSubgraph(nodes, links);
          }

          return { nodes, links };
        }

        _redraw() {
          this.updateComplete.then(() => this._draw());
        }

        _draw() {
          const container = this.querySelector('#sankey-container');
          if (!container || !this._data) return;

          const { nodes, links } = this._getFilteredData();
          const treeSizeMap = computeTreeSizesFromLinks(nodes, links);
          const newTop = computeTopPackages(nodes, treeSizeMap);
          const topKey = newTop.map((p) => `${p.name}:${p.treeSize}`).join(',');
          const curKey = (this._topPackages ?? []).map((p) => `${p.name}:${p.treeSize}`).join(',');
          if (topKey !== curKey) this._topPackages = newTop;
          const useListView = this._selectedDepth === 1 && !this._focusedPackage;
          if (useListView) {
            const directNodes = nodes.filter((n) => this._data.rootDeps.has(n.name));
            this._drawDepth1List(container, directNodes, treeSizeMap);
            if (this._visibleCount !== directNodes.length) this._visibleCount = directNodes.length;
          } else {
            container.style.minHeight = '640px';
            renderSankey(container, nodes, links, this._selectedDepth, treeSizeMap, (name) => this._focusPackage(name), this._vulnMap);
            if (this._visibleCount !== nodes.length) this._visibleCount = nodes.length;
          }
        }

        _focusPackage(name) {
          if (this._focusedPackage === name) {
            this._clearSearch();
            return;
          }
          this._searchQuery = name;
          this._focusedPackage = name;
          this._selectedDepth = this._maxDepth;
          this._inputFocused = false;
          this._suggestions = [];
          this._redraw();
        }

        _onDepthChange(e) {
          this._selectedDepth = Number(e.target.value);
          this._redraw();
        }

        _setFilter(value) {
          this._filter = this._filter === value ? 'all' : value;
          this._redraw();
        }

        _renderVulnStatus() {
          if (this._vulnStatus === 'loading')
            return html`<span class="text-xs text-slate-500 select-none animate-pulse">Running audit…</span>`;
          if (this._vulnStatus === 'done' && this._vulnMap?.size)
            return html`<button @click=${() => this._setFilter('vuln')} class="text-xs font-semibold select-none cursor-pointer transition-opacity hover:opacity-70" style="color:#ef4444;background:none;border:none;padding:0">⚠ audit: ${this._vulnMap.size}</button>`;
          if (this._vulnStatus === 'done')
            return html`<span class="text-xs select-none" style="color:#10b981">✓ audit clean</span>`;
          if (this._vulnStatus === 'error')
            return html`<span class="text-xs text-slate-600 select-none">OSV unavailable</span>`;
          return '';
        }

        _computeSuggestions(q) {
          if (!q || !this._data) return [];
          const lower = q.toLowerCase();
          const seen = new Map();
          for (const n of this._data.nodes) {
            if (n.isRoot) continue;
            if (!n.nameLower.includes(lower)) continue;
            if (!seen.has(n.name) || (n.isConflict && !seen.get(n.name).isConflict))
              seen.set(n.name, { name: n.name, isConflict: n.isConflict });
          }
          return [...seen.values()]
            .sort((a, b) => {
              const aExact = a.name.toLowerCase() === lower;
              const bExact = b.name.toLowerCase() === lower;
              if (aExact !== bExact) return aExact ? -1 : 1;
              const aStart = a.name.toLowerCase().startsWith(lower);
              const bStart = b.name.toLowerCase().startsWith(lower);
              if (aStart !== bStart) return aStart ? -1 : 1;
              return a.name.localeCompare(b.name);
            })
            .slice(0, 10);
        }

        _onSearchInput(e) {
          this._searchQuery = e.target.value;
          this._focusedPackage = null;
          this._suggestions = this._computeSuggestions(this._searchQuery);
        }

        _onSearchFocus() {
          this._inputFocused = true;
        }

        _onSearchBlur() {
          setTimeout(() => { this._inputFocused = false; }, 120);
        }

        _clearSearch() {
          this._searchQuery = '';
          this._focusedPackage = null;
          this._inputFocused = false;
          this._suggestions = [];
          this._redraw();
        }

        _getFocusSubgraph(nodes, links) {
          const seedIds = new Set(
            nodes.filter((n) => n.name === this._focusedPackage).map((n) => n.id)
          );

          const incoming = new Map();
          const outgoing = new Map();
          for (const n of nodes) { incoming.set(n.id, []); outgoing.set(n.id, []); }
          for (const l of links) {
            incoming.get(l.target)?.push(l.source);
            outgoing.get(l.source)?.push(l.target);
          }

          const ancestors = bfsReach(seedIds, incoming);
          const descendants = bfsReach(seedIds, outgoing);
          const allowed = new Set([...ancestors, ...descendants]);
          return {
            nodes: nodes.filter((n) => allowed.has(n.id)),
            links: links.filter((l) => allowed.has(l.source) && allowed.has(l.target)),
          };
        }

        _setDepthFromLegend(colorIndex) {
          const depth =
            colorIndex >= DEPTH_COLORS.length - 1
              ? this._maxDepth
              : Math.min(colorIndex + 1, this._maxDepth);
          this._selectedDepth = depth;
          this._redraw();
        }

        _drawDepth1List(container, nodes, treeSizeMap) {
          container.innerHTML = '';
          container.style.minHeight = '';

          if (!nodes.length) {
            container.innerHTML = NO_PACKAGES_MSG;
            return;
          }

          const { rootDeps } = this._data;
          const groups = { prod: [], dev: [], peer: [], optional: [] };
          for (const node of nodes) {
            const type = rootDeps.get(node.name) ?? (node.dev ? 'dev' : 'prod');
            groups[type].push({ ...node, treeSize: treeSizeMap.get(node.id) ?? 0 });
          }
          for (const list of Object.values(groups)) {
            list.sort((a, b) => b.treeSize - a.treeSize || a.name.localeCompare(b.name));
          }

          const maxSize = Math.max(1, ...nodes.map((n) => treeSizeMap.get(n.id) ?? 0));

          const groupConfig = [
            { key: 'prod', label: 'Production', color: '#10b981' },
            { key: 'dev', label: 'Development', color: '#6366f1' },
            { key: 'peer', label: 'Peer', color: '#a78bfa' },
            { key: 'optional', label: 'Optional', color: '#f59e0b' },
          ];

          const wrap = document.createElement('div');
          wrap.style.cssText = 'padding:8px 0;font-family:system-ui,sans-serif';

          for (const { key, label, color } of groupConfig) {
            const list = groups[key];
            if (!list.length) continue;

            const section = document.createElement('div');
            section.style.cssText = 'margin-bottom:24px';

            const hdr = document.createElement('div');
            hdr.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px';
            hdr.innerHTML = `
              <span style="color:${color};font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em">${label}</span>
              <span style="color:#334155;font-size:11px">${list.length}</span>
              <div style="flex:1;height:1px;background:#1e293b"></div>
            `;
            section.appendChild(hdr);

            for (const pkg of list) {
              const row = document.createElement('div');
              row.style.cssText = `
                display:grid;grid-template-columns:1fr 100px 68px;
                align-items:center;gap:10px;
                padding:7px 10px;margin-bottom:3px;
                border-radius:7px;cursor:pointer;
                border:1px solid transparent;background:transparent;
                transition:background .1s,border-color .1s;
              `;

              const pkgVulns = this._vulnMap?.get(pkg.id) ?? [];
              const pkgWorstSev = pkgVulns.length ? worstSeverity(pkgVulns) : null;
              const pkgVulnColor = pkgWorstSev ? SEVERITY_COLOR[pkgWorstSev] : null;
              const nameDiv = document.createElement('div');
              nameDiv.innerHTML = `
                <div style="display:flex;align-items:center;gap:6px;min-width:0">
                  <div style="font-size:13px;color:${pkgVulnColor ?? (pkg.isConflict ? '#c026d3' : '#cbd5e1')};font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pkg.name}</div>
                  ${pkgVulns.length ? `<span style="flex-shrink:0;font-size:10px;color:${pkgVulnColor};background:#1f1010;border:1px solid ${pkgVulnColor}44;border-radius:3px;padding:1px 5px;white-space:nowrap">⚠ ${pkgWorstSev ?? 'VULN'}</span>` : ''}
                </div>
                <div style="font-size:11px;color:#475569;margin-top:1px">v${pkg.version}${pkg.isConflict && pkg.conflictVersions?.length ? ` · <span style="color:#a21caf">${pkg.conflictVersions.length} versions</span>` : ''}</div>
              `;

              const barPct = Math.max(2, (pkg.treeSize / maxSize) * 100);
              const barTrack = document.createElement('div');
              barTrack.style.cssText = 'height:4px;background:#1e293b;border-radius:2px;overflow:hidden';
              barTrack.innerHTML = `<div style="width:${barPct.toFixed(1)}%;height:4px;background:${color};border-radius:2px;min-width:2px"></div>`;

              const countDiv = document.createElement('div');
              countDiv.style.cssText = 'font-size:12px;color:#475569;text-align:right;white-space:nowrap';
              countDiv.textContent = pkg.treeSize === 0 ? 'no deps' : `${pkg.treeSize} dep${pkg.treeSize !== 1 ? 's' : ''}`;

              row.appendChild(nameDiv);
              row.appendChild(barTrack);
              row.appendChild(countDiv);

              row.addEventListener('mouseenter', () => {
                row.style.background = '#1e293b';
                row.style.borderColor = '#334155';
              });
              row.addEventListener('mouseleave', () => {
                row.style.background = 'transparent';
                row.style.borderColor = 'transparent';
              });
              row.addEventListener('click', () => this._focusPackage(pkg.name));

              section.appendChild(row);
            }

            wrap.appendChild(section);
          }

          container.appendChild(wrap);
        }

        _reset() {
          this._phase = 'idle';
          this._data = null;
          this._error = '';
          this._maxDepth = null;
          this._selectedDepth = null;
          this._filter = 'all';
          this._conflictCount = 0;
          this._searchQuery = '';
          this._visibleCount = 0;
          this._suggestions = [];
          this._inputFocused = false;
          this._focusedPackage = null;
          this._topPackages = null;
          this._showInfo = false;
          this._vulnMap = null;
          this._vulnStatus = 'idle';
          this._osvRequestId++;
          document.title = 'Package Lock Visualizer';
          hideTip();
        }

        render() {
          const rootNode = this._data?.nodes.find((n) => n.isRoot);
          const totalCount = this._data?.nodes.filter((n) => !n.isRoot).length ?? 0;
          return html`
            <div class="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
              <!-- Branding header -->
              <header class="px-6 pt-5 pb-4">

                      ? html`

                          </div>

                    <h1 class="text-2xl font-semibold tracking-tight">
                      ${this._data ? this._data.name : 'Package Lock Visualizer'}
                    </h1>

                            <code class="text-blue-400 bg-blue-400/10 px-1.5 py-0.5 rounded text-xs"

              <!-- Sticky control bar (only when data loaded) -->

                    <div

                    >

                        class="max-w-screen-xl mx-auto flex items-center justify-between gap-3"
                      >
                        <div class="flex items-center gap-2 flex-wrap">
                          ${this._maxDepth
                            ? html`
                                <div
                                  class="flex items-center gap-2 text-sm text-slate-400
                                  border border-slate-700 rounded px-3 py-1"
                                >
                                  <span class="select-none">Depth</span>
                                  <select

                                        </option>
                                      `
                                    )}
                                  </select>
                                </div>
                                <div class="w-px h-5 bg-slate-800 select-none"></div>
                              `
                            : ''}
                          <div class="flex items-center gap-1.5">
                            ${[
                              { value: 'prod',     label: 'Prod',     activeStyle: 'border-color:#cbd5e1;background:#cbd5e1;color:#0f172a;box-shadow:0 1px 0 rgba(255,255,255,0.05) inset' },
                              { value: 'dev',      label: 'Dev',      activeStyle: 'border-color:#cbd5e1;background:#cbd5e1;color:#0f172a;box-shadow:0 1px 0 rgba(255,255,255,0.05) inset' },
                              { value: 'conflict', label: `Conflicts${this._conflictCount ? ' ' + this._conflictCount : ''}`, activeStyle: 'border-color:#a855f7;background:#a855f7;color:#1a0a24' },
                              ...(this._vulnStatus === 'done' ? [{ value: 'vuln', label: `Audit${this._vulnMap?.size ? ' ' + this._vulnMap.size : ''}`, activeStyle: 'border-color:#f97316;background:#f97316;color:#1a0a00' }] : []),
                            ].map(({ value, label, activeStyle }) => html`
                              <button
                                @click=${() => this._setFilter(value)}
                                class="text-sm px-3 py-1 rounded-md border cursor-pointer select-none transition-colors font-medium"
                                style="${this._filter === value ? activeStyle : 'border-color:#334155;color:#94a3b8;background:transparent'}"
                              >${label}</button>
                            `)}
                          </div>
                          <div class="w-px h-5 bg-slate-800 select-none"></div>
                          <div style="position:relative">
                            <div
                              class="flex items-center gap-2 text-sm text-slate-400
                                  border border-slate-700 rounded px-3 py-1"
                            >
                              <svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"

                                class="shrink-0 text-slate-500"
                              >
                                <circle cx="11" cy="11" r="8" />

                              </svg>
                              <input

                                @input=${this._onSearchInput}
                                @focus=${this._onSearchFocus}
                                @blur=${this._onSearchBlur}
                                class="bg-transparent text-slate-200 outline-none placeholder-slate-600 w-40"
                              />
                              ${this._searchQuery
                                ? html`
                                    <button
                                      @click=${this._clearSearch}
                                      class="text-slate-500 hover:text-slate-300 transition-colors cursor-pointer leading-none"
                                      style="font-size:16px;line-height:1"
                                    >
                                      ×
                                    </button>
                                  `
                                : ''}
                            </div>
                            ${this._inputFocused && this._suggestions.length
                              ? html`
                                  <div
                                    style="position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:260px"
                                    class="bg-slate-800 border border-slate-700 rounded-lg py-1 shadow-xl"
                                  >
                                    ${this._suggestions.map(
                                      (s) => html`

                              : ''}
                          </div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                          ${this._renderVulnStatus()}
                          <div style="position:relative">
                            <span class="text-sm text-slate-500 select-none">
                              <strong class="text-slate-300 font-medium">${this._visibleCount}</strong>
                              ${this._visibleCount !== totalCount ? html`of ${totalCount} ` : ''}packages
                            </span>
                            <button
                              @click=${() => (this._showInfo = !this._showInfo)}
                              class="ml-1.5 text-slate-500 hover:text-slate-300 transition-colors cursor-pointer align-middle"
                              style="font-size:14px;line-height:1"
                              title="Package stats"
                            >ⓘ</button>
                            ${this._showInfo
                              ? html`
                                  <div
                                    style="position:fixed;inset:0;z-index:99"
                                    @click=${() => (this._showInfo = false)}
                                  ></div>
                                  <div
                                    style="position:absolute;right:0;top:calc(100% + 8px);z-index:100;min-width:260px"
                                    class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-4"
                                    @click=${(e) => e.stopPropagation()}
                                  >
                                    ${[
                                      ['Visible', html`<span class="text-slate-200 font-medium">${this._visibleCount} packages</span>`],
                                      ['Total unique', this._data.uniqueCount],
                                      ['Install paths', this._data.installPaths],
                                      ['Max depth', this._maxDepth],
                                      ['Lockfile version', `v${this._data.lockfileVersion}`],
                                      ['Version conflicts', html`<span style="${this._conflictCount ? 'color:#c026d3' : ''}">${this._conflictCount}</span>`],
                                      ['Audit issues', this._vulnStatus === 'loading'
                                        ? html`<span style="color:#64748b">checking…</span>`
                                        : this._vulnStatus === 'done'
                                          ? html`<span style="${this._vulnMap?.size ? 'color:#ef4444' : 'color:#10b981'}">${this._vulnMap?.size ?? 0}</span>`
                                          : html`<span style="color:#64748b">unavailable</span>`],
                                    ].map(([label, value]) => html`
                                      <div class="flex items-center justify-between py-1.5 text-sm border-b border-slate-700/50 last:border-0">
                                        <span class="text-slate-400">${label}</span>
                                        <span class="text-slate-200">${value}</span>
                                      </div>
                                    `)}
                                  </div>
                                `
                              : ''}
                          </div>
                          <button
                            @click=${this._reset}
                            class="flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-200
                             border border-slate-700 hover:border-slate-500 rounded px-3 py-1
                             transition-colors cursor-pointer"
                          >
                            <svg
                              width="13"
                              height="13"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2.5"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <polyline points="16 16 12 12 8 16" />
                              <line x1="12" y1="12" x2="12" y2="21" />
                              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
                            </svg>
                            Upload
                          </button>
                        </div>
                      </div>
                    </div>
                  `
                : ''}

              <!-- Content -->
              <div class="flex-1 px-6 pb-6 pt-6">
                <div class="max-w-screen-xl mx-auto">
                  ${this._phase !== 'loaded'
                  ? html`
                      <div
                        class="drop-zone relative overflow-hidden border-2 border-dashed border-slate-700 rounded-xl p-20 text-center cursor-pointer
                         hover:border-blue-500 hover:bg-blue-950/25 transition-all select-none"
                        @dragover=${this._onDragOver}
                        @dragleave=${this._onDragLeave}
                        @drop=${this._onDrop}
                        @click=${() => this.querySelector('#file-input').click()}
                      >
                        <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 800 400" aria-hidden="true">
                          <path d="M-20,90 C200,90 200,170 400,170 S600,80 820,80" fill="none" stroke="#6366f1" stroke-width="44" stroke-opacity="0.06" />
                          <path d="M-20,200 C200,200 200,250 400,250 S600,200 820,200" fill="none" stroke="#06b6d4" stroke-width="34" stroke-opacity="0.06" />
                          <path d="M-20,320 C200,320 200,270 400,270 S600,320 820,320" fill="none" stroke="#10b981" stroke-width="26" stroke-opacity="0.06" />
                        </svg>
                        <div class="relative">
                          <svg class="mx-auto mb-6" width="64" height="48" viewBox="0 0 64 48" fill="none" aria-hidden="true">
                            <path d="M8 12 C 20 12, 20 11, 30 11" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.55" fill="none"/>
                            <path d="M8 36 C 20 36, 20 37, 30 37" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.55" fill="none"/>
                            <path d="M36 11 C 46 11, 46 24, 56 24" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.55" fill="none"/>
                            <path d="M36 37 C 46 37, 46 24, 56 24" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.55" fill="none"/>
                            <rect x="2" y="6" width="6" height="14" fill="#6366f1" rx="1.5"/>
                            <rect x="2" y="28" width="6" height="14" fill="#3b82f6" rx="1.5"/>
                            <rect x="30" y="0" width="6" height="22" fill="#06b6d4" rx="1.5"/>
                            <rect x="30" y="26" width="6" height="22" fill="#10b981" rx="1.5"/>
                            <rect x="56" y="14" width="6" height="20" fill="#f59e0b" rx="1.5"/>
                          </svg>
                          <p class="text-slate-200 font-medium text-lg">
                            Drop your package-lock.json here
                          </p>
                          <p class="text-slate-500 text-sm mt-2">or click to browse</p>
                        </div>
                        ${this._error
                          ? html`
                              <p
                                class="text-red-400 text-sm mt-6 max-w-md mx-auto bg-red-950/40 border border-red-900/50 rounded-lg p-3"
                              >
                                ${this._error}
                              </p>
                            `
                          : ''}
                        <input
                          id="file-input"
                          type="file"
                          accept=".json"
                          class="hidden"
                          @change=${this._onFileInput}
                        />
                      </div>

                      ${this._savedFiles.length > 0 ? html`
                        <div class="mt-8">
                          <div class="text-xs font-medium text-slate-500 uppercase tracking-widest mb-3 select-none">
                            Recent Files
                          </div>
                          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${(() => {
                              const maxPkg = Math.max(1, ...this._savedFiles.map((f) => f.pkgCount));
                              return this._savedFiles.map((f) => {
                                const ratio = f.pkgCount / maxPkg;
                                const segs = 7;
                                const filled = Math.max(1, Math.round(ratio * segs));
                                return html`
                                  <div
                                    @click=${() => this._loadJson(JSON.parse(f.raw))}
                                    class="group relative cursor-pointer rounded-lg overflow-hidden border border-slate-700 bg-slate-800/60 hover:border-slate-500 hover:bg-slate-700/40 transition-colors select-none text-left"
                                  >
                                    <div class="h-[3px] flex">
                                      ${Array.from({ length: segs }, (_, i) => html`
                                        <div class="flex-1" style="background:${i < filled ? DEPTH_COLORS[Math.min(i, DEPTH_COLORS.length - 1)] : '#1e293b'};${i > 0 ? 'margin-left:1px;' : ''}opacity:${i < filled ? 0.85 : 1}"></div>
                                      `)}
                                    </div>
                                    <div class="px-4 py-3">
                                      <button
                                        @click=${(e) => this._deleteFile(f.id, e)}
                                        class="absolute top-3 right-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all w-6 h-6 flex items-center justify-center rounded"
                                        title="Remove"
                                      >✕</button>
                                      <div class="text-slate-200 font-medium truncate pr-6">${f.name}</div>
                                      <div class="flex items-baseline gap-1.5 mt-1">
                                        <span class="text-slate-300 text-sm font-medium tabular-nums">${f.pkgCount.toLocaleString()}</span>
                                        <span class="text-slate-500 text-xs">packages</span>
                                      </div>
                                      <div class="text-slate-600 text-xs mt-0.5">${new Date(f.savedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                                    </div>
                                  </div>
                                `;
                              });
                            })()}
                          </div>
                        </div>
                      ` : ''}
                    `
                  : ''}
                ${this._phase === 'loaded'
                  ? html`
                      ${this._topPackages?.length
                        ? html`
                            <div class="mb-5">
                              <div
                                class="text-xs font-medium text-slate-500 uppercase tracking-widest mb-3 select-none"
                              >
                                Largest Dependency Trees
                              </div>
                              <div class="flex gap-3">
                                ${this._topPackages.map(
                                  (p) => html`
                                    <div
                                      @click=${() => this._focusPackage(p.name)}
                                      class="flex-1 cursor-pointer rounded-lg px-4 py-3 border transition-colors select-none
                                        ${this._focusedPackage === p.name
                                          ? 'border-slate-300 bg-slate-700/60'
                                          : 'border-slate-700 bg-slate-800/60 hover:border-slate-500 hover:bg-slate-700/40'}"
                                    >
                                      <div class="text-sm font-medium text-slate-200">${p.name}</div>
                                      <div class="text-xs text-slate-500 mt-0.5">
                                        ${p.treeSize} pkg tree
                                      </div>
                                    </div>
                                  `
                                )}
                              </div>
                            </div>
                          `
                        : ''}
                      <div
                        class="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden"
                      >
                        <div class="overflow-x-auto p-4">
                          <div id="sankey-container" class="w-full"></div>
                        </div>
                        <div class="border-t border-slate-700/60 bg-slate-900/40 px-4 py-3 flex items-center justify-center gap-5 flex-wrap">
                        ${DEPTH_COLORS.map((color, i) => {
                          const label =
                            i === 0
                              ? 'Direct'
                              : i < DEPTH_COLORS.length - 1
                                ? `Depth ${i + 1}`
                                : `Depth ${i + 1}+`;
                          const activeIdx = Math.min(
                            (this._selectedDepth ?? 1) - 1,
                            DEPTH_COLORS.length - 1
                          );
                          const isActive = i === activeIdx;
                          return html`
                            <div
                              class="flex items-center gap-1.5 text-sm cursor-pointer select-none transition-colors
                               ${isActive
                                ? 'text-slate-100'
                                : 'text-slate-500 hover:text-slate-300'}"
                              @click=${() => this._setDepthFromLegend(i)}
                            >
                              <span
                                style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0;
                          ${isActive ? `box-shadow:0 0 0 2px ${color}55` : ''}"
                              ></span>
                              ${label}
                            </div>
                          `;
                        })}
                        <span class="text-slate-700 select-none mx-1">|</span>
                        <div class="flex items-center gap-1.5 text-sm" style="color:#c026d3">
                          <span
                            style="width:10px;height:10px;border-radius:50%;background:#c026d3;display:inline-block;flex-shrink:0"
                          ></span>
                          Version conflict
                        </div>
                        ${this._vulnStatus === 'done' && this._vulnMap?.size ? html`
                          <div class="flex items-center gap-1.5 text-sm text-slate-400">
                            <span style="display:flex;gap:2px;flex-shrink:0">
                              ${['#fbbf24','#f59e0b','#f97316','#ef4444'].map(c => html`<span style="width:6px;height:10px;border-radius:2px;background:${c};display:inline-block"></span>`)}
                            </span>
                            Audit (low→critical)
                          </div>
                        ` : ''}
                        <div class="flex items-center gap-1.5 text-sm text-slate-400">
                          <svg width="16" height="10" style="flex-shrink:0">
                            <line
                              x1="0"
                              y1="5"
                              x2="16"
                              y2="5"
                              stroke="#94a3b8"
                              stroke-width="2"
                              stroke-dasharray="4 2"
                            />
                          </svg>
                          Peer dependency
                        </div>
                        </div>
                      </div>
                    `
                  : ''}
                </div>
              </div>
            </div>
          `;
        }
      }

      customElements.define('pkg-lock-visualizer', PkgLockVisualizer);
    </script>
  </body>
</html>
