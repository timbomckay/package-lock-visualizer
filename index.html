<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Lock Visualizer</title>
    <meta
      name="description"
      content="Visualize your package-lock.json as an interactive Sankey diagram. Explore dependency trees, spot version conflicts, and trace transitive dependencies."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Package Lock Visualizer" />
    <meta
      property="og:description"
      content="Visualize your package-lock.json as an interactive Sankey diagram. Explore dependency trees, spot version conflicts, and trace transitive dependencies."
    />
    <meta
      property="og:image"
      content="https://github.com/user-attachments/assets/16125362-78df-4418-bfa1-49e806f6dc78"
    />
    <meta property="og:image:alt" content="Package Lock Visualizer preview" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Package Lock Visualizer" />
    <meta
      name="twitter:description"
      content="Visualize your package-lock.json as an interactive Sankey diagram. Explore dependency trees, spot version conflicts, and trace transitive dependencies."
    />
    <meta
      name="twitter:image"
      content="https://github.com/user-attachments/assets/16125362-78df-4418-bfa1-49e806f6dc78"
    />
    <meta name="twitter:image:alt" content="Package Lock Visualizer preview" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.jsdelivr.net/npm/lit@3/+esm",
          "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm",
          "d3-sankey": "https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/+esm",
          "semver": "https://cdn.jsdelivr.net/npm/semver@6/+esm"
        }
      }
    </script>

    <style>
      body {
        background: #0f172a;
        font-family: system-ui, sans-serif;
      }

      .drop-zone {
        transition:
          border-color 0.2s,
          background 0.2s;
      }

      .drop-zone.drag-over {
        border-color: #3b82f6 !important;
        background: rgba(59, 130, 246, 0.06);
      }

      .sankey-link {
        fill: none;
        stroke-opacity: 0.22;
        transition: stroke-opacity 0.15s;
      }

      .sankey-link:hover {
        stroke-opacity: 0.65;
      }

      .sankey-link.peer {
        stroke-dasharray: 6 3;
        stroke-opacity: 0.28;
      }

      .sankey-link.peer:hover {
        stroke-opacity: 0.7;
      }

      #sankey-tooltip {
        position: fixed;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1.6;
        color: #e2e8f0;
        pointer-events: auto;
        z-index: 200;
        max-width: 280px;
        display: none;
      }
    </style>
  </head>

  <body class="text-slate-100">
    <pkg-lock-visualizer></pkg-lock-visualizer>
    <div id="sankey-tooltip"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
